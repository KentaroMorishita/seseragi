name: Work-item subtask
description: 既存work-itemに従属し、独立したRoadmap位置やreleaseを持たない作業
title: ""
labels:
  - "role: subtask"
body:
  - type: markdown
    attributes:
      value: |
        subtaskは親work-itemのScope / Acceptanceに従属します。
        独立した優先順位・acceptance・releaseが必要ならwork-itemへ昇格してください。

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - compiler
        - runtime
        - tooling
        - testing
        - docs
        - spec
    validations:
      required: true

  - type: input
    id: parent
    attributes:
      label: Parent work-item
      description: このsubtaskが従属するwork-item。
      placeholder: "#470"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 従属Scope / Acceptance
      description: 親のどのacceptanceを補助する作業か。独立Issueにしない理由も明記。
    validations:
      required: true

  - type: checkboxes
    id: sanity
    attributes:
      label: Sanity check
      options:
        - label: "親work-itemのScope内に収まる"
          required: true
        - label: "独立した優先順位やreleaseを必要としない"
          required: true
