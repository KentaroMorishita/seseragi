name: Roadmap work-item
description: 独立して設計・実装・検証する価値がある作業
title: ""
labels:
  - "role: work-item"
body:
  - type: markdown
    attributes:
      value: |
        作成前に #559 のCurrent Roadmapと既存Issueを確認してください。
        細かい作業をIssue化すること自体を進捗にせず、独立したacceptanceがある場合だけwork-itemを作ります。

  - type: input
    id: roadmap
    attributes:
      label: Roadmap item
      description: 関連するRoadmap ID / root Issue。該当しなければ none。
      placeholder: "q1 / #601 / none"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      description: 主な技術/成果物領域。
      options:
        - compiler
        - runtime
        - tooling
        - testing
        - docs
        - spec
    validations:
      required: true

  - type: input
    id: epic
    attributes:
      label: Epic / Parent
      description: 関連するまとまりがあれば指定。なければ none。
      placeholder: "#464 / none"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 発見経路 / Evidence
      description: 再現、dogfood、spec gap、dependencyなど、この作業が実在する根拠。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope / Acceptance
      description: 何を直し、何を満たせば完了か。必要ならNon-goalsも記載。
    validations:
      required: true

  - type: textarea
    id: priority
    attributes:
      label: Priority / Dependency
      description: 今やる理由、前提Issue、後続への影響。特になければ none。
    validations:
      required: true

  - type: checkboxes
    id: sanity
    attributes:
      label: Sanity check
      options:
        - label: "#559 と既存Issueを確認し、重複していない"
          required: true
        - label: "独立Issueにするだけの明確なScope / Acceptanceがある"
          required: true
