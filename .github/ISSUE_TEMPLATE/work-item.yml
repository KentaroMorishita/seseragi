name: Orchestration work-item
description: 実行順が確定しており、OxxのImpl queueへ登録する独立work-item
title: ""
labels:
  - "role: work-item"
body:
  - type: markdown
    attributes:
      value: |
        **作成前に #559 → #512 → 対象Oxx root → Impl queue → 関連Epic を確認してください。**
        work-itemはIssue作成後、同じturn/sessionで対応Impl queueへexact Issue番号を挿入して初めて有効です。

  - type: dropdown
    id: orchestration
    attributes:
      label: Orchestration
      description: 所属する上位Orchestration。Issue作成後に同名Oxx labelが必要です。
      options:
        - O01
        - O02
        - O03
        - O04
        - O05
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      description: 主な技術/成果物領域。必要なら作成後に追加kindを付与できます。
      options:
        - compiler
        - runtime
        - tooling
        - testing
        - docs
        - spec
    validations:
      required: true

  - type: input
    id: root
    attributes:
      label: Orchestration root
      description: 対象Oxx root Issue番号（例 #549）
      placeholder: "#549"
    validations:
      required: true

  - type: input
    id: impl_queue
    attributes:
      label: Impl queue
      description: 実行順SSOTとなるImpl queue Issue番号（例 #291）
      placeholder: "#291"
    validations:
      required: true

  - type: input
    id: epic
    attributes:
      label: Epic
      description: 該当する場合のみ。なければ none。
      placeholder: "#352 / none"
    validations:
      required: true

  - type: textarea
    id: discovery
    attributes:
      label: 発見経路 / Evidence
      description: 再現、dogfood、spec gap、dependencyなど、このIssueが実在する根拠。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope / Acceptance
      description: 何を直し、何を満たせばImpl-readyか。Non-goalsも必要なら記載。
    validations:
      required: true

  - type: textarea
    id: order
    attributes:
      label: Queue位置の理由
      description: どのleafの前後へ置くか、そのdependency/priority理由。順番未確定ならwork-itemではなくcandidateを使ってください。
    validations:
      required: true

  - type: checkboxes
    id: contract
    attributes:
      label: Operating contract
      options:
        - label: "#512 を読み、このIssueが独立work-itemであることを確認した"
          required: true
        - label: "Issue作成後、同じturn/sessionでOxx labelとImpl queue entryを同期する"
          required: true
        - label: "queue位置を安全に決められない場合はcandidateへ変更する"
          required: true
