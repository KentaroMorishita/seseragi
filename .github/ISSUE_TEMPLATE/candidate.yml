name: Roadmap candidate
description: 実在するGapや提案だが、まだ実行優先度やScopeを確定していない候補
title: ""
labels:
  - "role: candidate"
body:
  - type: markdown
    attributes:
      value: |
        candidateはまだ実装開始対象ではありません。
        #559 のCurrent Roadmapと既存Issueを確認し、必要性とScopeが固まったらwork-itemまたはRoadmap TODOへ昇格します。

  - type: input
    id: roadmap
    attributes:
      label: Related Roadmap item
      description: 関連するRoadmap ID / root Issue。未分類なら none。
      placeholder: "q2 / #552 / none"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - compiler
        - runtime
        - tooling
        - testing
        - docs
        - spec
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence / Design question
      description: 再現/evidence、または明確に検討すべきdesign question。推測だけの候補はIssue化しません。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 想定Scope
      description: 現時点で分かる責務境界。実装方法を先に固定する必要はありません。
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: 昇格条件
      description: 何が分かればwork-item / Roadmap TODOとして実行開始できるか。
    validations:
      required: true

  - type: checkboxes
    id: sanity
    attributes:
      label: Sanity check
      options:
        - label: "#559 と既存Issueを確認し、重複していない"
          required: true
        - label: "現時点では実行優先度またはScopeが未確定である"
          required: true
