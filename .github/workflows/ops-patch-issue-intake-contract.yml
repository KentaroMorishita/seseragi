name: Ops Patch Issue Intake Contract

on:
  push:
    branches:
      - ops/issue-intake-contract-20260906

permissions:
  contents: read
  issues: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo

            const { data: contract } = await github.rest.issues.get({ owner, repo, issue_number: 512 })
            let body = contract.body || ''

            body = body.replace(
              '- `role: work-item`',
              '- `role: work-item` — Impl queueに独立した実行位置を持つleaf\n- `role: candidate` — 実在Gap/提案だがまだ実行順未確定。queueへ入るまで実装開始禁止\n- `role: subtask` — queued work-itemに従属し、独立queue位置を持たない作業'
            )

            const section = `
---

## 17. Issue intake / creation contract

新規Issue作成は単なる記録ではなく、**Orchestration graphへの登録操作**として扱う。

### agentがIssue作成前に読む順序

1. **#559 Orchestration Index** — 現在のOxx一覧・優先順を確認
2. **#512 本契約** — role / membership / queue / handoff規則を確認
3. 対象 **Oxx root** — purpose / state / predecessor / successor / lane対応を確認
4. 対象 **Impl queue** — semantic order / frontier /後続3〜5件を確認
5. 関連 **Epic** — scope boundaryがある場合だけ確認

この確認をせず、Issue titleや近いIssue番号だけから所属・優先順位を推測しない。

### roleを作成前に確定する

#### \`role: work-item\`

独立して実装・検証・Promotionされ得る **実行単位**。

必須:
- exactly one \`Oxx\` membership label
- \`role: work-item\`
- 少なくとも1つの \`kind:*\`
- 対応OxxのImpl queueに **checkbox entryがexactly one** 存在
- queue位置がsemantic dependency / priorityに照らして説明可能
- bodyに \`Operating contract: #512\` / Orchestration root / Impl queue / Epic（該当時）を記録

**work-item Issueを作成したのにqueueへ載せない状態をturn/sessionを跨いで残さない。**

作成後にIssue番号が確定したら、同じ作業単位でImpl queueへ挿入する。blocking gapなら最古affected position、non-blockingならdependencyと現在のOrchestration goalに沿う位置へ置く。

#### \`role: candidate\`

再現/evidenceのあるGap・提案だが、まだ実行順を確定していないもの。

- exactly one \`Oxx\`
- \`role: candidate\`
- \`kind:*\`
- Impl queueには**載せない**
- candidateの間は実装開始・Promotion開始しない

実行対象へ昇格する際は、**\`candidate -> work-item\` relabelとImpl queue挿入を同じ更新で行う**。

「いつかやるかも」だけの推測Issueをcandidateとして大量生成しない。再現/evidenceまたは明確なdesign questionが必要。

#### \`role: subtask\`

既存のqueued work-itemが所有する従属作業。

- exactly one \`Oxx\`
- \`role: subtask\`
- \`kind:*\`
- bodyに \`Parent work-item: #N\` を明記
- 独立Impl queue entry / Promotion entryを持たない
- parent work-itemがordering / checkpoint / Promotion / releaseを所有

scopeが独立したrelease/orderを必要とするまで拡大したらsubtaskのまま放置せず、work-itemへ昇格してqueueへ挿入する。

#### \`role: epic\`

意味のグルーピング。exactly one \`Oxx\` を持つが、Epic自体をImpl queueの実行順として扱わない。

#### \`role: control\`

#512 / #547 / #548 / #559等の全Orchestration共通control/infrastructure。原則Oxx labelを持たない。

### atomic creation rule

agentが新規work-itemを作る場合、同一turn / sessionで最低限:

1. Oxx決定
2. role / kind決定
3. Issue作成
4. Oxx label付与
5. Impl queueへexact Issue番号をcheckboxで挿入
6. 関連Epicのmembership/listを必要なら同期
7. Issue本文へ #512 / root / Impl / discovery / acceptance evidenceを記録
8. queue全体を再読し、重複・順序破壊がないことを確認

まで完了する。

queue位置を安全に決められない場合、work-itemとして孤立させずcandidateとして作成する。

### discovered gap rule

実装・preflight・dogfood中に新Gapを発見した場合:

- 現leafのacceptanceを直接blockする同根fix → 現leafへ吸収可能かroot causeで判断
- 独立scopeだが現在queueをblockする → work-item化し適切な位置へ挿入
- 実在するがnon-blocking / order未確定 → candidate
- 既存queued leafに完全従属 → subtask
- 推測のみ → Issue化しない

新Issueを作ること自体を進捗とみなさない。

### promotion transition

work-itemがImpl-readyになった時だけ:

1. Impl queue \`[x]\`
2. \`stage: promotion-ready\`
3. **同じOxxのpaired Promotion queue**へentry追加
4. branch + exact SHA / scoped evidenceを同期

を同じhandoffで行う。

### machine audit

repositoryのIssue Contract workflowは新規/編集Issueについて最低限:

- roleが一意か
- Oxx membershipが契約どおりか
- work-itemが対応Impl queueにexactly once存在するか
- candidate/subtaskが独立queueへ紛れ込んでいないか
- subtask parentが同じOxxのqueued work-itemか
- promotion-readyとImpl/Promotion queue状態が矛盾していないか

を監査する。

機械監査greenはsemantic queue orderの正しさを証明しない。順序判断のSSOTは各Impl queue coordinatorが持つ。
`

            if (!body.includes('## 17. Issue intake / creation contract')) {
              body += section
            }

            await github.rest.issues.update({ owner, repo, issue_number: 512, body })

            const { data: index } = await github.rest.issues.get({ owner, repo, issue_number: 559 })
            let indexBody = index.body || ''
            if (!indexBody.includes('## 新規Issueを立てるとき')) {
              indexBody += `\n\n## 新規Issueを立てるとき\n\n1. 本IndexでOxxを決める\n2. #512のIssue intake contractを読む\n3. Oxx root -> Impl queue -> 関連Epicを読む\n4. 独立実行するならwork-item + queue entry、順番未確定ならcandidate、queued parent従属ならsubtask\n5. work-itemはqueue未登録のまま残さない\n`
              await github.rest.issues.update({ owner, repo, issue_number: 559, body: indexBody })
            }
