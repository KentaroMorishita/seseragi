name: Ops Issue Intake Audit

on:
  push:
    branches:
      - ops/issue-intake-contract-20260906

permissions:
  contents: read
  issues: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const mapping = new Map([
              ['O01', 291],
              ['O02', 518],
              ['O03', 533],
              ['O04', 463],
              ['O05', 531],
            ])
            const oLabels = [...mapping.keys()]

            const queueBodies = new Map()
            for (const [oid, queueNumber] of mapping) {
              const { data } = await github.rest.issues.get({ owner, repo, issue_number: queueNumber })
              queueBodies.set(oid, data.body || '')
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            })

            const workItemOrphans = []
            const workItemNoO = []
            const multiO = []
            const epicNoO = []
            const controlsWithO = []

            for (const issue of issues) {
              if (issue.pull_request) continue
              const labels = (issue.labels || []).map(l => typeof l === 'string' ? l : l.name)
              const role = labels.filter(l => l.startsWith('role: '))
              const memberships = labels.filter(l => oLabels.includes(l))

              if (memberships.length > 1) multiO.push(`#${issue.number} ${memberships.join(',')}`)
              if (labels.includes('role: control') && memberships.length) controlsWithO.push(`#${issue.number} ${memberships.join(',')}`)
              if (labels.includes('role: epic') && memberships.length !== 1) epicNoO.push(`#${issue.number} membership=${memberships.join(',') || 'none'}`)

              if (labels.includes('role: work-item')) {
                if (memberships.length !== 1) {
                  workItemNoO.push(`#${issue.number} membership=${memberships.join(',') || 'none'}`)
                  continue
                }
                const oid = memberships[0]
                const body = queueBodies.get(oid) || ''
                const re = new RegExp(`(^|\\n)\\s*-\\s*\\[[ xX]\\]\\s*#${issue.number}(?=\\D|$)`)
                if (!re.test(body)) {
                  workItemOrphans.push(`#${issue.number} (${oid}) ${issue.title}`)
                }
              }
            }

            core.info(`work-item without queue entry (${workItemOrphans.length}):\n${workItemOrphans.join('\n') || '(none)'}`)
            core.info(`work-item membership errors (${workItemNoO.length}):\n${workItemNoO.join('\n') || '(none)'}`)
            core.info(`multi-O (${multiO.length}):\n${multiO.join('\n') || '(none)'}`)
            core.info(`epic membership errors (${epicNoO.length}):\n${epicNoO.join('\n') || '(none)'}`)
            core.info(`controls with Oxx (${controlsWithO.length}):\n${controlsWithO.join('\n') || '(none)'}`)

            await core.summary
              .addHeading('Issue intake audit')
              .addRaw(`Work-item without Impl queue entry: ${workItemOrphans.length}\n`)
              .addCodeBlock(workItemOrphans.join('\n') || '(none)')
              .addRaw(`\nWork-item membership errors: ${workItemNoO.length}\n`)
              .addCodeBlock(workItemNoO.join('\n') || '(none)')
              .addRaw(`\nMulti-O: ${multiO.length}\n`)
              .addCodeBlock(multiO.join('\n') || '(none)')
              .write()
