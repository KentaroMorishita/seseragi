name: Site verification

on:
  pull_request:
    paths:
      - ".github/workflows/site-verification.yml"
      - "apps/site/**"
      - "apps/playground/**"
      - "assets/brand/**"
      - "crates/**"
      - "runtime/**"
      - "examples/**"
      - "docs/spec/**"
      - "docs/design/docs-site/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - "biome.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install locked root dependencies
        run: bun install --frozen-lockfile
      - name: Install locked Playground dependencies
        working-directory: apps/playground
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: apps/playground
        run: bunx playwright install --with-deps chromium
      - name: Record exact source and toolchain
        run: |
          mkdir -p target/site-verification/screenshots
          git rev-parse HEAD > target/site-verification/commit.txt
          bun --version > target/site-verification/bun.txt
          rustc --version > target/site-verification/rust.txt
          sha256sum bun.lock Cargo.lock apps/site/seseragi.lock > target/site-verification/locks.txt
      - name: Verify the complete site, deterministic artifacts and browser
        env:
          CARGO_INCREMENTAL: "0"
          SESERAGI_SITE_PROFILE: ${{ github.workspace }}/target/site-verification/phases.jsonl
          SESERAGI_SITE_TEST_EVIDENCE: ${{ github.workspace }}/target/site-verification/manifests
          SITE_SCREENSHOTS: ${{ github.workspace }}/target/site-verification/screenshots
        run: |
          set -o pipefail
          python3 apps/site/scripts/profile-process.py \
            --report target/site-verification/process-tree.json \
            --timeout 3300 --limit-mib 4096 \
            -- bun run check:site 2>&1 | tee target/site-verification/check-site.log
      - name: Record optimized CLI provenance
        if: ${{ !cancelled() }}
        run: |
          if test -x target/release/seseragi; then
            target/release/seseragi --version-json > target/site-verification/cli.json
            sha256sum target/release/seseragi > target/site-verification/cli.sha256
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: site-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/site-verification
          if-no-files-found: error
          retention-days: 14
