name: Seseragi release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.provenance.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Fetch the current main history
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Verify tag commit and main containment
        id: provenance
        run: |
          release_sha="$(bun scripts/release-gate.ts check-main \
            --tag "$GITHUB_REF_NAME" \
            --main-ref refs/remotes/origin/main)"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
      - name: Verify tag and generated metadata
        run: |
          bun scripts/release-contract.ts check
          bun scripts/release-contract.ts check-tag "$GITHUB_REF_NAME"
          bun scripts/release-readiness.ts check
      - name: Verify Marketplace publishing authority
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${VSCE_PAT:-}" ]]; then
            echo "::error::VSCE_PAT is required to publish both Seseragi extension IDs."
            exit 1
          fi
          cd extensions/seseragi
          bun install --frozen-lockfile
          bun run vsce verify-pat seseragi-dev
      - name: Run repository-wide release source gate
        run: bun run check:release-gate

  native:
    needs: gate
    name: native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            archive: tar.gz
          - runner: macos-15-intel
            target: darwin-x64
            archive: tar.gz
          - runner: ubuntu-latest
            target: linux-x64
            archive: tar.gz
          - runner: windows-latest
            target: win32-x64
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Build CLI and LSP
        run: cargo build --locked --release -p seseragi-cli -p seseragi-lsp
      - name: Package, extract, and smoke test native archive
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          bun scripts/native-release.ts smoke \
            --version "$release_version" \
            --target "${{ matrix.target }}" \
            --output target/release \
            --release
      - uses: actions/upload-artifact@v4
        with:
          name: seseragi-release-${{ needs.gate.outputs.release_sha }}-native-${{ matrix.target }}
          path: |
            target/release/seseragi-v*-${{ matrix.target }}.${{ matrix.archive }}
            target/release/seseragi-v*-${{ matrix.target }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          overwrite: true

  native-verify:
    needs: [gate, native]
    name: native downloaded smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            archive: tar.gz
          - runner: macos-15-intel
            target: darwin-x64
            archive: tar.gz
          - runner: ubuntu-latest
            target: linux-x64
            archive: tar.gz
          - runner: windows-latest
            target: win32-x64
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/download-artifact@v4
        with:
          name: seseragi-release-${{ needs.gate.outputs.release_sha }}-native-${{ matrix.target }}
          path: target/release
      - name: Verify downloaded native archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          bun scripts/native-release.ts verify \
            --version "$release_version" \
            --target "${{ matrix.target }}" \
            --archive "target/release/seseragi-v${release_version}-${{ matrix.target }}.${{ matrix.archive }}" \
            --release

  vscode:
    needs: gate
    name: vscode (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-latest
            target: linux-x64
          - runner: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install extension dependencies
        working-directory: extensions/seseragi
        run: bun install --frozen-lockfile
      - name: Package, extract, and smoke test release VSIX
        working-directory: extensions/seseragi
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          export SESERAGI_EXTENSION_TARGET="${{ matrix.target }}"
          export SESERAGI_EXTENSION_OUTPUT="../../target/release/seseragi-v${release_version}-vscode-${{ matrix.target }}.vsix"
          bun run package
      - name: Re-verify release VSIX artifact
        working-directory: extensions/seseragi
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          bun scripts/verify-package.ts "../../target/release/seseragi-v${release_version}-vscode-${{ matrix.target }}.vsix" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: seseragi-release-${{ needs.gate.outputs.release_sha }}-vscode-${{ matrix.target }}
          path: target/release/seseragi-v*-vscode-${{ matrix.target }}.vsix
          if-no-files-found: error
          overwrite: true

  vscode-legacy:
    needs: gate
    name: vscode legacy migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install extension dependencies
        working-directory: extensions/seseragi
        run: bun install --frozen-lockfile
      - name: Package legacy migration VSIX
        working-directory: extensions/seseragi
        env:
          SESERAGI_LEGACY_EXTENSION_OUTPUT: ../../target/release/seseragi-legacy-migration-${{ github.ref_name }}.vsix
        run: |
          bun ../../scripts/check-extension-identity.ts
          bun run package:legacy
      - uses: actions/upload-artifact@v4
        with:
          name: seseragi-release-${{ needs.gate.outputs.release_sha }}-vscode-legacy-migration
          path: target/release/seseragi-legacy-migration-v*.vsix
          if-no-files-found: error
          overwrite: true

  wasm-runtime:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          fetch-depth: 0
      - name: Package verified WASM and runtime archives
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          mkdir -p target/release
          cp -R apps/playground/src/wasm/pkg target/release/wasm
          tar -C target/release -czf "target/release/seseragi-wasm-v${release_version}.tar.gz" wasm
          tar -C runtime -czf "target/release/seseragi-runtime-v${release_version}.tar.gz" ts
      - uses: actions/upload-artifact@v4
        with:
          name: seseragi-release-${{ needs.gate.outputs.release_sha }}-web
          path: |
            target/release/seseragi-wasm-v*.tar.gz
            target/release/seseragi-runtime-v*.tar.gz
          if-no-files-found: error
          overwrite: true

  marketplace:
    needs: [gate, native-verify, vscode, vscode-legacy, wasm-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install Marketplace publishing tool
        working-directory: extensions/seseragi
        run: bun install --frozen-lockfile
      - name: Re-verify release ref before Marketplace publish
        run: |
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME
          release_sha="$(bun scripts/release-gate.ts check-main \
            --tag "$GITHUB_REF_NAME" \
            --main-ref refs/remotes/origin/main)"
          test "$release_sha" = "${{ needs.gate.outputs.release_sha }}"
      - uses: actions/download-artifact@v4
        with:
          pattern: seseragi-release-${{ needs.gate.outputs.release_sha }}-vscode-*
          path: target/release
          merge-multiple: true
      - name: Re-verify downloaded VSIX packages
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          for target in darwin-arm64 darwin-x64 linux-x64 win32-x64; do
            bun extensions/seseragi/scripts/verify-package.ts \
              "target/release/seseragi-v${release_version}-vscode-${target}.vsix" \
              "$target"
          done
          bun extensions/seseragi/scripts/verify-legacy-package.ts \
            "target/release/seseragi-legacy-migration-v${release_version}.vsix"
      - name: Publish official and legacy VS Code extensions
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VSCE_PAT:-}" ]]; then
            echo "::error::VSCE_PAT is required to publish both Seseragi extension IDs."
            exit 1
          fi
          release_version="${GITHUB_REF_NAME#v}"
          extensions/seseragi/node_modules/.bin/vsce publish \
            --skip-duplicate \
            --packagePath \
            "target/release/seseragi-v${release_version}-vscode-darwin-arm64.vsix" \
            "target/release/seseragi-v${release_version}-vscode-darwin-x64.vsix" \
            "target/release/seseragi-v${release_version}-vscode-linux-x64.vsix" \
            "target/release/seseragi-v${release_version}-vscode-win32-x64.vsix"
          extensions/seseragi/node_modules/.bin/vsce publish \
            --skip-duplicate \
            --packagePath \
            "target/release/seseragi-legacy-migration-v${release_version}.vsix"
      - name: Verify Marketplace propagation
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          bun scripts/marketplace-release.ts verify "$release_version" \
            --attempts 18 \
            --delay-ms 10000

  publish:
    needs: [gate, native-verify, vscode, vscode-legacy, wasm-runtime, marketplace]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Re-verify release ref before publish
        run: |
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME
          release_sha="$(bun scripts/release-gate.ts check-main \
            --tag "$GITHUB_REF_NAME" \
            --main-ref refs/remotes/origin/main)"
          test "$release_sha" = "${{ needs.gate.outputs.release_sha }}"
      - uses: actions/download-artifact@v4
        with:
          pattern: seseragi-release-${{ needs.gate.outputs.release_sha }}-*
          path: target/release
          merge-multiple: true
      - name: Generate release notes from the changelog
        run: bun scripts/release-contract.ts notes target/RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Seseragi ${{ github.ref_name }}
          body_path: target/RELEASE_NOTES.md
          files: |
            target/release/seseragi-v*
            target/release/seseragi-runtime-v*.tar.gz
            target/release/seseragi-wasm-v*.tar.gz
            target/release/seseragi-legacy-migration-v*.vsix
