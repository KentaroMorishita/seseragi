name: Seseragi release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-promotion
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
      create_tag: ${{ steps.plan.outputs.create_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Plan one canonical release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(bun scripts/release-contract.ts info | jq -r .tag)"
          published=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            published=true
          fi
          bun scripts/release-promotion.ts plan --published "$published"
  gate:
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
    outputs:
      release_sha: ${{ steps.provenance.outputs.release_sha }}
      release_tag: ${{ needs.plan.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      - name: Verify canonical metadata before promotion
        run: |
          bun scripts/release-contract.ts check
          bun scripts/release-contract.ts check-tag "$RELEASE_TAG"
          bun scripts/release-readiness.ts check
      - name: Install Chromium for browser lifecycle tests
        run: |
          cd apps/playground
          bun install --frozen-lockfile
          bunx playwright install chromium
      - name: Run repository-wide release source gate
        run: ./scripts/check-scoped.sh release-gate-after-wasm
      - name: Create the canonical tag after the source gate
        if: needs.plan.outputs.create_tag == 'true'
        env:
          RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Seseragi $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
      - name: Verify tag commit and main containment
        id: provenance
        run: |
          git fetch --force origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG
          release_sha="$(bun scripts/release-gate.ts check-main \
            --tag "$RELEASE_TAG" \
            --main-ref refs/remotes/origin/main)"
          test "$release_sha" = "${{ needs.plan.outputs.release_sha }}"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  native:
    needs: gate
    name: native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            archive: tar.gz
          - runner: macos-15-intel
            target: darwin-x64
            archive: tar.gz
          - runner: ubuntu-latest
            target: linux-x64
            archive: tar.gz
          - runner: windows-latest
            target: win32-x64
            archive: zip
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Build CLI and LSP
        run: cargo build --locked --release -p seseragi-cli -p seseragi-lsp
      - name: Package, extract, and smoke test native archive
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          bun scripts/native-release.ts smoke \
            --version "$release_version" \
            --target "${{ matrix.target }}" \
            --output target/release \
            --release
      - uses: actions/upload-artifact@v4
        with:
          name: seseragi-release-${{ needs.gate.outputs.release_sha }}-native-${{ matrix.target }}
          path: |
            target/release/seseragi-v*-${{ matrix.target }}.${{ matrix.archive }}
            target/release/seseragi-v*-${{ matrix.target }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          overwrite: true

  native-verify:
    needs: [gate, native]
    name: native downloaded smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            archive: tar.gz
          - runner: macos-15-intel
            target: darwin-x64
            archive: tar.gz
          - runner: ubuntu-latest
            target: linux-x64
            archive: tar.gz
          - runner: windows-latest
            target: win32-x64
            archive: zip
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/download-artifact@v4
        with:
          name: seseragi-release-${{ needs.gate.outputs.release_sha }}-native-${{ matrix.target }}
          path: target/release
      - name: Verify downloaded native archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          bun scripts/native-release.ts verify \
            --version "$release_version" \
            --target "${{ matrix.target }}" \
            --archive "target/release/seseragi-v${release_version}-${{ matrix.target }}.${{ matrix.archive }}" \
            --release

  vscode:
    needs: gate
    name: vscode (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-latest
            target: linux-x64
          - runner: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install extension dependencies
        working-directory: extensions/seseragi
        run: bun install --frozen-lockfile
      - name: Package, extract, and smoke test release VSIX
        working-directory: extensions/seseragi
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          export SESERAGI_EXTENSION_TARGET="${{ matrix.target }}"
          export SESERAGI_EXTENSION_OUTPUT="../../target/release/seseragi-v${release_version}-vscode-${{ matrix.target }}.vsix"
          bun scripts/package-extension.ts
      - name: Re-verify release VSIX artifact
        working-directory: extensions/seseragi
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          bun scripts/verify-package.ts "../../target/release/seseragi-v${release_version}-vscode-${{ matrix.target }}.vsix" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: seseragi-release-${{ needs.gate.outputs.release_sha }}-vscode-${{ matrix.target }}
          path: target/release/seseragi-v*-vscode-${{ matrix.target }}.vsix
          if-no-files-found: error
          overwrite: true

  vscode-legacy:
    needs: gate
    name: vscode legacy migration
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install extension dependencies
        working-directory: extensions/seseragi
        run: bun install --frozen-lockfile
      - name: Package legacy migration VSIX
        working-directory: extensions/seseragi
        env:
          SESERAGI_LEGACY_EXTENSION_OUTPUT: ../../target/release/seseragi-legacy-migration-${{ needs.gate.outputs.release_tag }}.vsix
        run: |
          bun ../../scripts/check-extension-identity.ts
          bun run package:legacy
      - uses: actions/upload-artifact@v4
        with:
          name: seseragi-release-${{ needs.gate.outputs.release_sha }}-vscode-legacy-migration
          path: target/release/seseragi-legacy-migration-v*.vsix
          if-no-files-found: error
          overwrite: true

  wasm-runtime:
    needs: gate
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          fetch-depth: 0
      - name: Package verified WASM and runtime archives
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          mkdir -p target/release
          cp -R apps/playground/src/wasm/pkg target/release/wasm
          tar -C target/release -czf "target/release/seseragi-wasm-v${release_version}.tar.gz" wasm
          tar -C runtime -czf "target/release/seseragi-runtime-v${release_version}.tar.gz" ts
      - uses: actions/upload-artifact@v4
        with:
          name: seseragi-release-${{ needs.gate.outputs.release_sha }}-web
          path: |
            target/release/seseragi-wasm-v*.tar.gz
            target/release/seseragi-runtime-v*.tar.gz
          if-no-files-found: error
          overwrite: true

  local-web-product-e2e:
    needs: [gate, native-verify, vscode]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install frozen E2E dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd apps/playground --frozen-lockfile
      - name: Install Chromium
        run: cd apps/playground && bunx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: seseragi-release-${{ needs.gate.outputs.release_sha }}-native-linux-x64
          path: target/release
      - uses: actions/download-artifact@v4
        with:
          name: seseragi-release-${{ needs.gate.outputs.release_sha }}-vscode-linux-x64
          path: target/release
      - name: Run downloaded release artifacts through the product journey
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          xvfb-run --auto-servernum bun scripts/local-web-product-e2e.ts \
            --version "$release_version" \
            --target linux-x64 \
            --native "target/release/seseragi-v${release_version}-linux-x64.tar.gz" \
            --vsix "target/release/seseragi-v${release_version}-vscode-linux-x64.vsix" \
            --output target/release/local-web-product-e2e
      - uses: actions/upload-artifact@v4
        with:
          name: seseragi-release-${{ needs.gate.outputs.release_sha }}-local-web-product-e2e
          path: target/release/local-web-product-e2e
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [gate, native-verify, vscode, vscode-legacy, wasm-runtime, local-web-product-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Re-verify release ref before publish
        run: |
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG
          release_sha="$(bun scripts/release-gate.ts check-main \
            --tag "$RELEASE_TAG" \
            --main-ref refs/remotes/origin/main)"
          test "$release_sha" = "${{ needs.gate.outputs.release_sha }}"
      - uses: actions/download-artifact@v4
        with:
          pattern: seseragi-release-${{ needs.gate.outputs.release_sha }}-*
          path: target/release
          merge-multiple: true
      - name: Generate release notes from the changelog
        run: bun scripts/release-contract.ts notes target/RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.release_tag }}
          name: Seseragi ${{ needs.gate.outputs.release_tag }}
          body_path: target/RELEASE_NOTES.md
          files: |
            target/release/seseragi-v*
            target/release/seseragi-runtime-v*.tar.gz
            target/release/seseragi-wasm-v*.tar.gz
            target/release/seseragi-legacy-migration-v*.vsix
