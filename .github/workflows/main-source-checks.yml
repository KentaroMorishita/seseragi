name: Main source checks

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      - uses: ./.github/actions/setup-wasi-sdk
      - name: Install the locked wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Install Chromium for browser tests
        working-directory: apps/playground
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Run repository-wide source checks
        run: ./scripts/check-scoped.sh release-gate-after-wasm
