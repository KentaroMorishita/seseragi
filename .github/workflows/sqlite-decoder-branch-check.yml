name: SQLite Decoder Branch Check

on:
  push:
    branches:
      - fix/sqlite-decoder-applicative

permissions:
  contents: write

jobs:
  decoder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch imported nominal identity
        run: python3 scripts/patch-decoder-identity.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Build CLI
        run: cargo build -p seseragi-cli
      - name: Update fixture lock
        run: ./target/debug/seseragi lock update examples/spec/fixtures/projects/sqlite-application
      - name: Build fixture
        run: ./target/debug/seseragi build examples/spec/fixtures/projects/sqlite-application --out-dir /tmp/sqlite-decoder
      - name: Run fixture
        run: bun /tmp/sqlite-decoder/entry.ts
