name: Ops patch 548 provider lock refresh

on:
  push:
    branches:
      - fix/issue-548-provider-lock-refresh

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message != 'ops: apply #548 provider lock refresh' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const branch = 'fix/issue-548-provider-lock-refresh'

            async function patch(path, replacements) {
              const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: branch })
              if (Array.isArray(data) || !data.content || !data.sha) throw new Error(`cannot read ${path}`)
              let content = Buffer.from(data.content, 'base64').toString('utf8')
              for (const [before, after] of replacements) {
                if (!content.includes(before)) throw new Error(`missing patch anchor in ${path}: ${before}`)
                content = content.replace(before, after)
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path,
                branch,
                sha: data.sha,
                message: 'ops: apply #548 provider lock refresh',
                content: Buffer.from(content).toString('base64'),
              })
            }

            await patch('.github/workflows/promotion-prepare.yml', [[
              '          cargo check --workspace\n          bun run fixtures:generate',
              '          cargo build -p seseragi-cli --bin seseragi\n          bun scripts/refresh-provider-fixture-locks.ts --cli target/debug/seseragi\n          bun run fixtures:generate',
            ]])

            await patch('.github/workflows/promotion-contract.yml', [
              [
                '      - "scripts/prepare-promotion-release.test.ts"\n',
                '      - "scripts/prepare-promotion-release.test.ts"\n      - "scripts/refresh-provider-fixture-locks.ts"\n      - "scripts/refresh-provider-fixture-locks.test.ts"\n',
              ],
              [
                '      - "scripts/prepare-promotion-release.test.ts"\n  workflow_dispatch:',
                '      - "scripts/prepare-promotion-release.test.ts"\n      - "scripts/refresh-provider-fixture-locks.ts"\n      - "scripts/refresh-provider-fixture-locks.test.ts"\n  workflow_dispatch:',
              ],
              [
                'run: bunx biome lint scripts/prepare-promotion-release.ts scripts/prepare-promotion-release.test.ts',
                'run: bunx biome lint scripts/prepare-promotion-release.ts scripts/prepare-promotion-release.test.ts scripts/refresh-provider-fixture-locks.ts scripts/refresh-provider-fixture-locks.test.ts',
              ],
              [
                'run: bun test scripts/prepare-promotion-release.test.ts',
                'run: bun test scripts/prepare-promotion-release.test.ts scripts/refresh-provider-fixture-locks.test.ts',
              ],
            ])
