name: Promotion prepare

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: promotion-prepare-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.comment.body == '/promote' && !github.event.issue.pull_request
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Resolve Orchestration and Promotion queue contract
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const association = context.payload.comment?.author_association
            if (!['OWNER', 'MEMBER', 'COLLABORATOR'].includes(association)) {
              core.setFailed(`unauthorized /promote author association: ${association || 'unknown'}`)
              return
            }

            const leafNumber = context.payload.issue.number
            const getIssue = issue_number =>
              github.rest.issues.get({ owner, repo, issue_number }).then(result => result.data)
            const names = issue => (issue.labels || []).map(label =>
              typeof label === 'string' ? label : label.name
            )

            const leaf = await getIssue(leafNumber)
            const leafLabels = names(leaf)
            const memberships = leafLabels.filter(label => /^O\d{2}$/u.test(label))
            if (memberships.length !== 1) {
              core.setFailed(`leaf #${leafNumber} must have exactly one Oxx label; found ${memberships.join(', ') || 'none'}`)
              return
            }
            if (!leafLabels.includes('role: work-item')) {
              core.setFailed(`leaf #${leafNumber} must be role: work-item`)
              return
            }
            if (!leafLabels.includes('stage: promotion-ready')) {
              core.setFailed(`leaf #${leafNumber} is not stage: promotion-ready`)
              return
            }

            const oid = memberships[0]
            const indexIssue = await getIssue(559)
            let registry = null
            for (const line of (indexIssue.body || '').split('\n')) {
              const match = line.match(/^\|\s*(O\d{2})\s*\|[^|]*\|\s*#(\d+)\s*\|\s*#(\d+)\s*\|\s*#(\d+)\s*\|/u)
              if (match?.[1] === oid) {
                registry = {
                  root: Number(match[2]),
                  impl: Number(match[3]),
                  promotion: Number(match[4]),
                }
                break
              }
            }
            if (!registry) {
              core.setFailed(`${oid} is missing from #559 Orchestration Index`)
              return
            }

            const [root, impl, promotion] = await Promise.all([
              getIssue(registry.root),
              getIssue(registry.impl),
              getIssue(registry.promotion),
            ])
            if (!names(root).includes(oid) || !names(root).includes('role: orchestration')) {
              core.setFailed(`${oid} root #${registry.root} contract mismatch`)
              return
            }
            if (!names(impl).includes(oid) || !names(impl).includes('queue: implementation')) {
              core.setFailed(`${oid} Impl queue #${registry.impl} contract mismatch`)
              return
            }
            if (!names(promotion).includes(oid) || !names(promotion).includes('queue: promotion')) {
              core.setFailed(`${oid} Promotion queue #${registry.promotion} contract mismatch`)
              return
            }

            const queueMatches = (body, issueNumber) => {
              const expression = new RegExp(`^\\s*-\\s*\\[([ xX])\\]\\s*#${issueNumber}(?=\\D|$)`, 'gmu')
              return [...(body || '').matchAll(expression)].map(match => match[1].toLowerCase() === 'x')
            }
            const implEntries = queueMatches(impl.body, leafNumber)
            if (implEntries.length !== 1 || !implEntries[0]) {
              core.setFailed(`leaf #${leafNumber} must appear exactly once as [x] in Impl queue #${registry.impl}`)
              return
            }

            const promotionLines = (promotion.body || '').split('\n')
            const unchecked = promotionLines
              .map(line => line.match(/^\s*-\s*\[ \]\s*#(\d+)\b/u))
              .filter(Boolean)
              .map(match => Number(match[1]))
            if (unchecked[0] !== leafNumber) {
              core.setFailed(`leaf #${leafNumber} is not Promotion frontier; current frontier is #${unchecked[0] || 'none'}`)
              return
            }

            const entryPattern = new RegExp(`^\\s*-\\s*\\[ \\]\\s*#${leafNumber}\\s+—\\s+\\x60([^\\x60]+)\\x60\\s+@\\s+\\x60([0-9a-f]{40})\\x60`, 'u')
            const entryLine = promotionLines.find(line => entryPattern.test(line))
            const entry = entryLine?.match(entryPattern)
            if (!entry) {
              core.setFailed(`Promotion queue #${registry.promotion} has no canonical branch/SHA entry for #${leafNumber}`)
              return
            }
            const sourceBranch = entry[1]
            const expectedSha = entry[2]
            if (!/^[A-Za-z0-9._/-]+$/u.test(sourceBranch) || sourceBranch.includes('..') || sourceBranch.includes('@{')) {
              core.setFailed(`unsafe source branch in Promotion queue: ${sourceBranch}`)
              return
            }

            core.setOutput('oid', oid)
            core.setOutput('root', String(registry.root))
            core.setOutput('impl', String(registry.impl))
            core.setOutput('promotion', String(registry.promotion))
            core.setOutput('leaf', String(leafNumber))
            core.setOutput('issue_title', (leaf.title || '').replace(/[\r\n]+/gu, ' ').trim())
            core.setOutput('source_branch', sourceBranch)
            core.setOutput('expected_sha', expectedSha)

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0

      - name: Validate latest main and exact origin checkpoint
        env:
          SOURCE_BRANCH: ${{ steps.resolve.outputs.source_branch }}
          EXPECTED_SHA: ${{ steps.resolve.outputs.expected_sha }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$SOURCE_BRANCH" >/dev/null
          git fetch --force origin \
            +refs/heads/main:refs/remotes/origin/main \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/promotion/source"
          actual_sha="$(git rev-parse refs/remotes/promotion/source)"
          test "$actual_sha" = "$EXPECTED_SHA" || {
            echo "stale handoff: expected $EXPECTED_SHA but origin/$SOURCE_BRANCH is $actual_sha" >&2
            exit 1
          }
          git checkout --detach refs/remotes/origin/main
          bun scripts/release-readiness.ts check
          if git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/main; then
            echo "checkpoint $EXPECTED_SHA is already contained in main" >&2
            exit 1
          fi

      - name: Build ancestry-preserving integration candidate
        id: candidate
        env:
          OID: ${{ steps.resolve.outputs.oid }}
          LEAF: ${{ steps.resolve.outputs.leaf }}
          EXPECTED_SHA: ${{ steps.resolve.outputs.expected_sha }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          source_short="${EXPECTED_SHA:0:8}"
          main_short="${main_sha:0:8}"
          promotion_branch="promote/${OID}/issue-${LEAF}-${source_short}-${main_short}"
          git checkout -B "$promotion_branch" refs/remotes/origin/main
          if ! git merge --no-ff --no-commit "$EXPECTED_SHA"; then
            git merge --abort || true
            echo "semantic/conflict resolution is forbidden in Promotion; return to Impl" >&2
            exit 1
          fi
          git commit -m "promote(${OID}): integrate #${LEAF} checkpoint"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "integration_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "promotion_branch=$promotion_branch" >> "$GITHUB_OUTPUT"

      - name: Prepare deterministic release metadata and generated artifacts
        id: release
        env:
          LEAF: ${{ steps.resolve.outputs.leaf }}
          ISSUE_TITLE: ${{ steps.resolve.outputs.issue_title }}
          INTEGRATION_SHA: ${{ steps.candidate.outputs.integration_sha }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun install --cwd apps/playground --frozen-lockfile
          info="$(bun scripts/prepare-promotion-release.ts \
            --issue "$LEAF" \
            --title "$ISSUE_TITLE" \
            --date "$(date -u +%F)")"
          version="$(printf '%s' "$info" | jq -r .version)"
          tag="$(printf '%s' "$info" | jq -r .tag)"

          cargo build -p seseragi-cli --bin seseragi
          bun scripts/refresh-provider-fixture-locks.ts --cli target/debug/seseragi
          bun run fixtures:generate
          bun scripts/generate-playground-samples.ts
          bun run build:playground:wasm
          bun scripts/release-contract.ts check

          unexpected=0
          while IFS= read -r file; do
            case "$file" in
              CHANGELOG.md|Cargo.toml|Cargo.lock|package.json|runtime/ts/package.json|apps/playground/package.json|extensions/seseragi/package.json|extensions/seseragi-legacy/package.json|apps/playground/src/generated/sample-manifest.ts|apps/playground/tests/fixtures/*.interaction.json|apps/playground/src/wasm/pkg/*|examples/spec/fixtures/projects/*/seseragi.lock)
                ;;
              *)
                echo "unexpected release-preparation diff: $file" >&2
                unexpected=1
                ;;
            esac
          done < <(git diff --name-only "$INTEGRATION_SHA")
          test "$unexpected" = 0

          git add CHANGELOG.md Cargo.toml Cargo.lock package.json \
            runtime/ts/package.json \
            apps/playground/package.json \
            extensions/seseragi/package.json \
            extensions/seseragi-legacy/package.json \
            apps/playground/src/generated/sample-manifest.ts \
            apps/playground/tests/fixtures/*.interaction.json \
            apps/playground/src/wasm/pkg \
            examples/spec/fixtures/projects
          git diff --cached --quiet && {
            echo "release preparation produced no changes" >&2
            exit 1
          }
          git commit -m "chore(release): prepare ${tag} for #${LEAF}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Playwright Chromium used by full gate
        working-directory: apps/playground
        run: bunx playwright install chromium

      - name: Run exact repository full gate
        run: bun run check

      - name: Verify immutable candidate after the gate
        env:
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)" || {
            git status --short >&2
            echo "full gate left the candidate dirty" >&2
            exit 1
          }
          bun scripts/release-contract.ts check
          bun scripts/release-contract.ts check-tag "$RELEASE_TAG"
          bun scripts/release-readiness.ts check

      - name: Publish immutable Promotion branch
        id: publish
        env:
          PROMOTION_BRANCH: ${{ steps.candidate.outputs.promotion_branch }}
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$PROMOTION_BRANCH" | awk '{print $1}')"
          if [[ -n "$remote_sha" ]]; then
            git fetch --force origin "+refs/heads/$PROMOTION_BRANCH:refs/remotes/promotion/existing"
            existing_tree="$(git rev-parse 'refs/remotes/promotion/existing^{tree}')"
            candidate_tree="$(git rev-parse "${CANDIDATE_SHA}^{tree}")"
            test "$existing_tree" = "$candidate_tree" || {
              echo "Promotion branch already exists with a different candidate: $PROMOTION_BRANCH" >&2
              exit 1
            }
            final_sha="$remote_sha"
          else
            git push origin "$CANDIDATE_SHA:refs/heads/$PROMOTION_BRANCH"
            final_sha="$CANDIDATE_SHA"
          fi
          echo "candidate_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Record Promotion preparation evidence
        uses: actions/github-script@v7
        env:
          OID: ${{ steps.resolve.outputs.oid }}
          ROOT: ${{ steps.resolve.outputs.root }}
          IMPL: ${{ steps.resolve.outputs.impl }}
          PROMOTION: ${{ steps.resolve.outputs.promotion }}
          LEAF: ${{ steps.resolve.outputs.leaf }}
          SOURCE_BRANCH: ${{ steps.resolve.outputs.source_branch }}
          EXPECTED_SHA: ${{ steps.resolve.outputs.expected_sha }}
          PROMOTION_BRANCH: ${{ steps.candidate.outputs.promotion_branch }}
          CANDIDATE_SHA: ${{ steps.publish.outputs.candidate_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            const { owner, repo } = context.repo
            const marker = `<!-- seseragi-promotion-ready:${process.env.LEAF}:${process.env.EXPECTED_SHA} -->`
            const body = [
              marker,
              '## Promotion candidate ready',
              '',
              `- Orchestration: **${process.env.OID}** / root #${process.env.ROOT}`,
              `- Impl / Promotion: #${process.env.IMPL} / #${process.env.PROMOTION}`,
              `- source: \`${process.env.SOURCE_BRANCH}\` @ \`${process.env.EXPECTED_SHA}\``,
              `- candidate: \`${process.env.PROMOTION_BRANCH}\` @ \`${process.env.CANDIDATE_SHA}\``,
              `- planned release: **${process.env.RELEASE_TAG}**`,
              `- exact full gate: **green** — ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              '',
              'Remote Promotion coordinator may now create the main PR from this exact candidate. Do not mutate the candidate branch; changed source/main identity requires a new preparation run.',
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: Number(process.env.LEAF), per_page: 100 })
            const existing = comments.find(comment => (comment.body || '').includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: Number(process.env.LEAF), body })
            }

      - name: Record failed Promotion preparation
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const leaf = context.payload.issue.number
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: leaf,
              body: [
                '## Promotion preparation failed',
                '',
                `GitHub-hosted preparation stopped without applying semantic/source fixes. Evidence: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                '',
                'If the failure requires a meaning-changing fix, return it to the paired Impl queue under #512 SYNC BARRIER.',
              ].join('\n'),
            })
