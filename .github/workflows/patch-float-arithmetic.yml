name: patch-float-arithmetic

on:
  push:
    branches: [fix/float-arithmetic-operators]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Float arithmetic patch
        run: python tmp/patch_float_arithmetic.py

      - name: Commit clean patch
        run: |
          rm tmp/patch_float_arithmetic.py
          rm .github/workflows/patch-float-arithmetic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/seseragi-semantics/src/typed/call_evidence.rs tmp/patch_float_arithmetic.py .github/workflows/patch-float-arithmetic.yml
          git commit -m "fix: support Float arithmetic operators"
          git push
