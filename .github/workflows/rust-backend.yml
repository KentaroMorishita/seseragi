name: Experimental Rust backend

on:
  pull_request:
    paths:
      - ".gitattributes"
      - ".bun-version"
      - ".github/workflows/rust-backend.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/seseragi-backend-rust/**"
      - "crates/seseragi-driver/**"
      - "crates/seseragi-lowering/**"
      - "crates/seseragi-runtime/**"
      - "crates/seseragi-semantics/**"
      - "crates/seseragi-syntax/**"
      - "crates/seseragi-project/**"
      - "crates/seseragi-cli/src/build.rs"
      - "crates/seseragi-cli/src/dev.rs"
      - "crates/seseragi-cli/src/local_project.rs"
      - "crates/seseragi-cli/src/experimental.rs"
      - "crates/seseragi-cli/src/experimental/**"
      - "crates/seseragi-cli/src/main.rs"
      - "crates/seseragi-cli/Cargo.toml"
      - "crates/seseragi-cli/tests/rust_backend.rs"
      - "crates/seseragi-cli/tests/inherited_equality.rs"
      - "crates/seseragi-cli/tests/process_entry_strict.rs"
      - "crates/seseragi-cli/tests/public_aliases.rs"
      - "crates/seseragi-cli/tests/namespace_results.rs"
      - "crates/seseragi-cli/tests/computed_callees.rs"
      - "crates/seseragi-cli/tests/nominal_lambda_identity.rs"
      - "crates/seseragi-cli/tests/fixtures/computed-callee-trace.mjs"
      - "crates/seseragi-cli/tests/build.rs"
      - "crates/seseragi-cli/tests/dev.rs"
      - "crates/seseragi-cli/tests/filesystem.rs"
      - "crates/seseragi-cli/tests/fibers.rs"
      - "crates/seseragi-cli/tests/async_filesystem.rs"
      - "crates/seseragi-cli/tests/program_wasm.rs"
      - "crates/seseragi-cli/tests/program_wasm_host_effect.rs"
      - "crates/seseragi-cli/tests/fixtures/program-wasm-host-effect.mjs"
      - "crates/seseragi-cli/tests/fixtures/program-wasm-host-lifetime.mjs"
      - "crates/seseragi-cli/tests/fixtures/program-wasm-host-watch.mjs"
      - "scripts/program-wasm-probe.mjs"
      - "scripts/program-wasm-effect-probe.mjs"
      - "scripts/program-wasm-effect-package-probe.mjs"
      - "scripts/build-program-wasm-demo.py"
      - "examples/spec/fixtures/rust-backend/**"
      - "examples/spec/fixtures/rust-backend-research/**"
      - "examples/spec/fixtures/rust-backend-projects/**"
      - "runtime/ts/**"
      - "scripts/scalar-tail-probe.ts"
      - "scripts/char-probe.ts"
      - "scripts/char-probe.mjs"
      - "scripts/float-probe.ts"
      - "scripts/float-probe.mjs"
      - "scripts/list-probe.ts"
      - "scripts/list-probe.mjs"
  push:
    branches: [main]
    paths:
      - ".gitattributes"
      - ".bun-version"
      - ".github/workflows/rust-backend.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/seseragi-backend-rust/**"
      - "crates/seseragi-driver/**"
      - "crates/seseragi-lowering/**"
      - "crates/seseragi-runtime/**"
      - "crates/seseragi-semantics/**"
      - "crates/seseragi-syntax/**"
      - "crates/seseragi-project/**"
      - "crates/seseragi-cli/src/build.rs"
      - "crates/seseragi-cli/src/dev.rs"
      - "crates/seseragi-cli/src/local_project.rs"
      - "crates/seseragi-cli/src/experimental.rs"
      - "crates/seseragi-cli/src/experimental/**"
      - "crates/seseragi-cli/src/main.rs"
      - "crates/seseragi-cli/Cargo.toml"
      - "crates/seseragi-cli/tests/rust_backend.rs"
      - "crates/seseragi-cli/tests/inherited_equality.rs"
      - "crates/seseragi-cli/tests/process_entry_strict.rs"
      - "crates/seseragi-cli/tests/public_aliases.rs"
      - "crates/seseragi-cli/tests/namespace_results.rs"
      - "crates/seseragi-cli/tests/computed_callees.rs"
      - "crates/seseragi-cli/tests/nominal_lambda_identity.rs"
      - "crates/seseragi-cli/tests/fixtures/computed-callee-trace.mjs"
      - "crates/seseragi-cli/tests/build.rs"
      - "crates/seseragi-cli/tests/dev.rs"
      - "crates/seseragi-cli/tests/filesystem.rs"
      - "crates/seseragi-cli/tests/fibers.rs"
      - "crates/seseragi-cli/tests/async_filesystem.rs"
      - "crates/seseragi-cli/tests/program_wasm.rs"
      - "crates/seseragi-cli/tests/program_wasm_host_effect.rs"
      - "crates/seseragi-cli/tests/fixtures/program-wasm-host-effect.mjs"
      - "crates/seseragi-cli/tests/fixtures/program-wasm-host-lifetime.mjs"
      - "crates/seseragi-cli/tests/fixtures/program-wasm-host-watch.mjs"
      - "scripts/program-wasm-probe.mjs"
      - "scripts/program-wasm-effect-probe.mjs"
      - "scripts/program-wasm-effect-package-probe.mjs"
      - "scripts/build-program-wasm-demo.py"
      - "examples/spec/fixtures/rust-backend/**"
      - "examples/spec/fixtures/rust-backend-research/**"
      - "examples/spec/fixtures/rust-backend-projects/**"
      - "runtime/ts/**"
      - "scripts/scalar-tail-probe.ts"
      - "scripts/char-probe.ts"
      - "scripts/char-probe.mjs"
      - "scripts/float-probe.ts"
      - "scripts/float-probe.mjs"
      - "scripts/list-probe.ts"
      - "scripts/list-probe.mjs"
  workflow_dispatch:
    inputs:
      integration:
        description: Verify canonical Linux WASM and the repository-wide source gate
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  file-transform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows cold builds and the full program/watch acceptance exceed 20m.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 20 }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - run: bun install --frozen-lockfile
      - name: Drain pending file stages, close real handles and join exceptional workers
        run: cargo test --locked -p seseragi-backend-rust --lib runtime::host_tests
      - name: Compare file programs, pending I/O, cancellation and finalizers on native, Bun and Node
        run: cargo test --locked -p seseragi-cli --test filesystem --test fibers --test async_filesystem
      - name: Compare inherited Ord equality, dictionary owners and source stages
        run: cargo test --locked -p seseragi-cli --test inherited_equality
      - name: Check process bootstrap strict types and initialization Defects
        run: cargo test --locked -p seseragi-cli --test process_entry_strict
      - name: Compare public alias exports, scoped binders and type-only initialization
        run: cargo test --locked -p seseragi-cli --test public_aliases
      - name: Compare namespace constructor owners and saved generic results
        run: cargo test --locked -p seseragi-cli --test namespace_results
      - name: Compare computed callees, strict source stages and cleanup
        run: cargo test --locked -p seseragi-cli --test computed_callees
      - name: Preserve nominal lambda identities, cold replay and scoped Defects
        run: cargo test --locked -p seseragi-cli --test nominal_lambda_identity
      - name: Verify product program WASM, generated declarations and callback ownership
        run: cargo test --locked -p seseragi-cli --test program_wasm --test program_wasm_host_effect
      - name: Rebuild selected program dependencies and drain old browser owners
        run: |
          cargo test --locked -p seseragi-cli --test dev watches_program_wasm_path_dependencies_keeps_failed_builds_and_closes_real_instances
          cargo test --locked -p seseragi-cli --test dev watches_host_effect_programs_and_drains_the_old_application_before_reload
          cargo test --locked -p seseragi-cli --test dev initial_program_
          bun test ./runtime/ts/tests/program-lifecycle.test.ts ./runtime/ts/tests/program-lifecycle-async.test.ts
          bunx tsc --strict --noEmit --skipLibCheck false --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM runtime/ts/tests/program-lifecycle-types.ts

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Install the comparison runtime
        run: bun install --frozen-lockfile
      - name: Verify deferred Effect stack safety on Bun and Node
        run: |
          mkdir -p target
          bun build runtime/ts/probes/effect-defer-stack.ts --target=node --outfile target/effect-defer-stack.mjs
          node target/effect-defer-stack.mjs
          bun target/effect-defer-stack.mjs
      - name: Verify sample command deadlines and inherited output
        run: bun test scripts/sample-cli-process.test.ts
      - name: Check Rust formatting
        run: |
          cargo fmt --all -- --check
          rustfmt --edition 2021 --check crates/seseragi-backend-rust/src/runtime*.rs
      - name: Verify Array, Tuple and List display order and shared depth on Bun and Node
        run: |
          bun build runtime/ts/probes/tuple-display.ts --target=node --outfile target/tuple-display.mjs
          node target/tuple-display.mjs
          bun target/tuple-display.mjs
      - name: Verify shared frontend boundary
        run: |
          cargo test --locked -p seseragi-driver --lib core_compile::tests
          cargo test --locked -p seseragi-lowering --lib core_analysis::scalar
          cargo test --locked -p seseragi-driver --test scalar_globals
      - name: Verify native values, captures, dictionaries, and teardown
        run: cargo test --locked -p seseragi-backend-rust
      - name: Compare the CLI Rust target with TypeScript execution
        run: cargo test --locked -p seseragi-cli --test rust_backend
      - name: Verify canonical reexport process builds on Bun and Node
        run: cargo test --locked -p seseragi-cli --test build process_reexports_share_bindings_and_preserve_facade_initialization
      - name: Verify opt-in cycle collection and resource research
        run: cargo test --locked -p seseragi-backend-rust --example native_lifetimes
      - name: Compare checked Effect and Ref sources with TypeScript
        run: |
          cargo build --locked -p seseragi-backend-rust --example native_lifetimes
          python3 crates/seseragi-backend-rust/examples/native_lifetimes/verify.py \
            --emitter target/debug/examples/native_lifetimes \
            --cli target/debug/seseragi --bun bun
      - name: Verify program WASM and the mixed Seseragi UI build
        run: |
          python3 crates/seseragi-backend-rust/examples/native_lifetimes/verify_wasm.py \
            --emitter target/debug/examples/native_lifetimes \
            --cli target/debug/seseragi --bun bun
      - uses: actions/upload-artifact@v4
        with:
          name: rust-backend-research
          path: |
            target/native-lifetimes/report.json
            target/native-wasm/report.json
            target/native-wasm/compute.wasm

  canonical-wasm:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      - uses: ./.github/actions/setup-wasi-sdk
      - name: Install the locked wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Verify canonical Linux WASM freshness
        run: |
          bun install --frozen-lockfile
          bun run check:wasm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-native-integration-wasm
          path: apps/playground/src/wasm/pkg

  integration-source-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    needs: [native, canonical-wasm]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      - uses: ./.github/actions/setup-wasi-sdk
      - name: Install the locked wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Install Chromium for browser integration
        run: |
          cd apps/playground
          bun install --frozen-lockfile
          bunx playwright install chromium
      - name: Verify the repository-wide source gate
        shell: bash
        run: |
          mkdir -p target
          echo "Integration reason: verify native backend, runtime and browser contracts before queue integration."
          ./scripts/check-scoped.sh release-gate-after-wasm 2>&1 | tee target/native-integration-source-gate.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-native-integration-source-gate
          path: target/native-integration-source-gate.log
