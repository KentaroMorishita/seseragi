name: Release contract

on:
  pull_request:
    paths:
      - ".bun-version"
      - ".github/workflows/release-contract.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "runtime/ts/package.json"
      - "apps/playground/package.json"
      - "apps/playground/src/wasm/pkg/package.json"
      - "extensions/seseragi/**"
      - "extensions/seseragi-legacy/**"
      - "crates/**/Cargo.toml"
      - "crates/seseragi-release/**"
      - "crates/seseragi-cli/**"
      - "crates/seseragi-lsp/**"
      - "crates/seseragi-wasm/**"
      - "scripts/release-contract.ts"
      - "scripts/release-contract.test.ts"
      - "scripts/release-gate.ts"
      - "scripts/release-gate.test.ts"
      - "scripts/release-readiness.ts"
      - "scripts/release-readiness.test.ts"
      - "scripts/release-promotion.ts"
      - "scripts/release-promotion.test.ts"
      - "scripts/native-release.ts"
      - "scripts/native-release-process.ts"
      - "scripts/native-release.test.ts"
      - "scripts/local-dogfood.ts"
      - "scripts/local-dogfood.test.ts"
      - "scripts/local-web-product-e2e.ts"
      - "scripts/local-web-product-e2e-extension.cjs"
      - "scripts/local-web-product-e2e.test.ts"
      - "scripts/fixtures/local-web-e2e-driver/**"
      - "scripts/check-extension-identity.ts"
      - "scripts/check-scoped.sh"
      - "CHANGELOG.md"
      - "docs/RELEASE.md"
  push:
    branches: [main]
    paths:
      - ".bun-version"
      - ".github/workflows/release-contract.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "runtime/ts/package.json"
      - "apps/playground/package.json"
      - "apps/playground/src/wasm/pkg/package.json"
      - "extensions/seseragi/**"
      - "extensions/seseragi-legacy/**"
      - "crates/**/Cargo.toml"
      - "crates/seseragi-release/**"
      - "crates/seseragi-cli/**"
      - "crates/seseragi-lsp/**"
      - "crates/seseragi-wasm/**"
      - "scripts/release-contract.ts"
      - "scripts/release-contract.test.ts"
      - "scripts/release-gate.ts"
      - "scripts/release-gate.test.ts"
      - "scripts/release-readiness.ts"
      - "scripts/release-readiness.test.ts"
      - "scripts/release-promotion.ts"
      - "scripts/release-promotion.test.ts"
      - "scripts/native-release.ts"
      - "scripts/native-release-process.ts"
      - "scripts/native-release.test.ts"
      - "scripts/local-dogfood.ts"
      - "scripts/local-dogfood.test.ts"
      - "scripts/local-web-product-e2e.ts"
      - "scripts/local-web-product-e2e-extension.cjs"
      - "scripts/local-web-product-e2e.test.ts"
      - "scripts/fixtures/local-web-e2e-driver/**"
      - "scripts/check-extension-identity.ts"
      - "scripts/check-scoped.sh"
      - "CHANGELOG.md"
      - "docs/RELEASE.md"
  workflow_dispatch:

# Manual canonical runs have unique groups; only superseded PR runs cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      # Restore on every event; save only from main so PRs cannot evict it.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-contract-check
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Check canonical version metadata
        run: bun run check:release
      # Only the version/distribution contract tests; the full CLI suites run in
      # their own scoped workflows.
      - name: Exercise CLI and LSP version contracts
        run: |
          cargo test --locked -p seseragi-release
          cargo test --locked -p seseragi-cli --test build -- --exact reports_version_commit_and_channel
          cargo test --locked -p seseragi-lsp --test stdio -- --exact binary_reports_its_distribution_contract
          cargo test --locked -p seseragi-cli --test run -- --exact single_file_and_package_compile_diagnostics_share_the_json_envelope
