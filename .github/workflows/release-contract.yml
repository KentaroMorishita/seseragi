name: Release contract

on:
  pull_request:
    paths:
      - ".github/workflows/release-contract.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "runtime/ts/package.json"
      - "apps/playground/package.json"
      - "apps/playground/src/wasm/pkg/package.json"
      - "extensions/seseragi/**"
      - "extensions/seseragi-legacy/**"
      - "crates/**/Cargo.toml"
      - "crates/seseragi-release/**"
      - "crates/seseragi-cli/**"
      - "crates/seseragi-lsp/**"
      - "crates/seseragi-wasm/**"
      - "scripts/release-contract.ts"
      - "scripts/release-contract.test.ts"
      - "scripts/release-gate.ts"
      - "scripts/release-gate.test.ts"
      - "scripts/native-release.ts"
      - "scripts/native-release.test.ts"
      - "scripts/check-extension-identity.ts"
      - "scripts/check-scoped.sh"
      - "CHANGELOG.md"
      - "docs/RELEASE.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-contract.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "runtime/ts/package.json"
      - "apps/playground/package.json"
      - "apps/playground/src/wasm/pkg/package.json"
      - "extensions/seseragi/**"
      - "extensions/seseragi-legacy/**"
      - "crates/**/Cargo.toml"
      - "crates/seseragi-release/**"
      - "crates/seseragi-cli/**"
      - "crates/seseragi-lsp/**"
      - "crates/seseragi-wasm/**"
      - "scripts/release-contract.ts"
      - "scripts/release-contract.test.ts"
      - "scripts/release-gate.ts"
      - "scripts/release-gate.test.ts"
      - "scripts/native-release.ts"
      - "scripts/native-release.test.ts"
      - "scripts/check-extension-identity.ts"
      - "scripts/check-scoped.sh"
      - "CHANGELOG.md"
      - "docs/RELEASE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Check canonical version metadata
        run: bun run check:release
      - name: Exercise CLI and LSP version contracts
        run: cargo test -p seseragi-release -p seseragi-cli -p seseragi-lsp
