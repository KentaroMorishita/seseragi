name: Release contract

on:
  pull_request:
    paths:
      - ".github/workflows/release-contract.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-readiness.yml"
      - "scripts/release-contract.ts"
      - "scripts/release-contract.test.ts"
      - "scripts/release-gate.ts"
      - "scripts/release-gate.test.ts"
      - "scripts/release-readiness.ts"
      - "scripts/release-readiness.test.ts"
      - "scripts/release-promotion.ts"
      - "scripts/release-promotion.test.ts"
      - "scripts/native-release.ts"
      - "scripts/native-release.test.ts"
      - "scripts/check-scoped.sh"
      - "package.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "runtime/ts/package.json"
      - "apps/playground/package.json"
      - "extensions/seseragi/package.json"
      - "extensions/seseragi-legacy/package.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-contract.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-readiness.yml"
      - "scripts/release-contract.ts"
      - "scripts/release-contract.test.ts"
      - "scripts/release-gate.ts"
      - "scripts/release-gate.test.ts"
      - "scripts/release-readiness.ts"
      - "scripts/release-readiness.test.ts"
      - "scripts/release-promotion.ts"
      - "scripts/release-promotion.test.ts"
      - "scripts/native-release.ts"
      - "scripts/native-release.test.ts"
      - "scripts/check-scoped.sh"
      - "package.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "runtime/ts/package.json"
      - "apps/playground/package.json"
      - "extensions/seseragi/package.json"
      - "extensions/seseragi-legacy/package.json"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun test scripts/release-contract.test.ts scripts/release-gate.test.ts scripts/release-readiness.test.ts scripts/release-promotion.test.ts scripts/native-release.test.ts
      - run: bun scripts/release-contract.ts check
      - run: bun scripts/release-readiness.ts check
