name: Web UI visual regression

on:
  pull_request:
    paths:
      - ".github/workflows/web-ui-visual.yml"
      - "apps/playground/**"
      - "examples/samples/**"
      - "runtime/ts/**"
      - "scripts/generate-playground-samples.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/web-ui-visual.yml"
      - "apps/playground/**"
      - "examples/samples/**"
      - "runtime/ts/**"
      - "scripts/generate-playground-samples.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install Playground dependencies
        working-directory: apps/playground
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: apps/playground
        run: bunx playwright install --with-deps chromium
      - name: Run Web UI visual regression
        working-directory: apps/playground
        run: bun run test:visual
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web-ui-visual-review
          path: apps/playground/test-results/web-ui-review
          if-no-files-found: warn
          retention-days: 14
