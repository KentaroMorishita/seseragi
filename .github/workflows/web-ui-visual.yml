name: Web UI visual regression

on:
  pull_request:
    paths:
      - ".github/ISSUE_TEMPLATE/showcase.md"
      - ".github/workflows/web-ui-visual.yml"
      - "apps/playground/**"
      - "docs/SHOWCASE_QUALITY.md"
      - "examples/samples/**"
      - "runtime/ts/**"
      - "scripts/generate-playground-samples.ts"
  push:
    branches: [main]
    paths:
      - ".github/ISSUE_TEMPLATE/showcase.md"
      - ".github/workflows/web-ui-visual.yml"
      - "apps/playground/**"
      - "docs/SHOWCASE_QUALITY.md"
      - "examples/samples/**"
      - "runtime/ts/**"
      - "scripts/generate-playground-samples.ts"
  workflow_dispatch:
    inputs:
      update_reason:
        description: "Human-approved design review reason for baseline update"
        required: false
        type: string

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install Playground dependencies
        working-directory: apps/playground
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: apps/playground
        run: bunx playwright install --with-deps chromium
      - name: Run Web UI visual regression
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_reason == '' }}
        working-directory: apps/playground
        run: bun run test:visual
      - name: Update reviewed Web UI baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_reason != '' }}
        working-directory: apps/playground
        env:
          BASELINE_REASON: ${{ inputs.update_reason }}
        run: bun run test:visual:update -- "$BASELINE_REASON"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web-ui-visual-review
          path: |
            apps/playground/test-results/web-ui-review
            apps/playground/e2e/web-ui-regression.spec.ts-snapshots
            apps/playground/e2e/visual-baselines.review.json
          if-no-files-found: warn
          retention-days: 14
