name: VS Code Extension

on:
  pull_request:
    paths:
      - ".github/workflows/vscode-extension.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/seseragi-lsp/**"
      - "crates/seseragi-release/**"
      - "extensions/seseragi/**"
      - "extensions/seseragi-legacy/**"
      - "scripts/check-extension-identity.ts"
      - "scripts/release-contract.ts"
      - "crates/seseragi-driver/**"
      - "crates/seseragi-semantics/**"
      - "crates/seseragi-source/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-latest
            target: linux-x64
          - runner: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install extension dependencies
        working-directory: extensions/seseragi
        run: bun install --frozen-lockfile
      - name: Test native language server
        run: cargo test -p seseragi-lsp
      - name: Package, extract, and smoke test platform VSIX
        working-directory: extensions/seseragi
        env:
          SESERAGI_EXTENSION_TARGET: ${{ matrix.target }}
        run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: seseragi-vscode-${{ matrix.target }}
          path: target/seseragi-v*-vscode-${{ matrix.target }}.vsix
          if-no-files-found: error

  migration:
    name: legacy migration stub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install extension dependencies
        working-directory: extensions/seseragi
        run: bun install --frozen-lockfile
      - name: Verify migration boundary and package the legacy stub
        working-directory: extensions/seseragi
        run: |
          bun ../../scripts/check-extension-identity.ts
          bun run package:legacy
      - uses: actions/upload-artifact@v4
        with:
          name: seseragi-vscode-legacy-migration
          path: target/seseragi-legacy-migration-v*.vsix
          if-no-files-found: error
