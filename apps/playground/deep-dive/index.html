<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e10" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Seseragi の設計の考え方、内部の意味、選んだ理由を読む記事"
    />
    <title>Seseragi Articles</title>
  </head>
  <body class="ui-app">
    <div class="app-shell pg-shell dd-shell">
      <header class="pg-top dd-topbar">
        <a class="pg-brand" href="../" aria-label="Seseragi Playground">
          <img src="/brand/seseragi-icon.svg" alt="" width="28" height="28" />
          <strong>Seseragi</strong>
          <span class="pg-version">v__SESERAGI_VERSION__</span>
        </a>
        <nav class="ui-view-switch pg-views" aria-label="Views">
          <a href="../"><svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5" /></svg><span>Playground</span></a>
          <a href="../tour/"><svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h4a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 0-1.5-1.5h-4zM13.5 3.5h-4A1.5 1.5 0 0 0 8 5v8a1.5 1.5 0 0 1 1.5-1.5h4z" /></svg><span>Tour</span></a>
        </nav>
        <div class="pg-top-actions">
          <button
            id="dd-search-button"
            class="ui-search-trigger pg-search"
            type="button"
            aria-haspopup="dialog"
            aria-controls="search-dialog"
            aria-keyshortcuts="Meta+K Control+K"
          >
            <svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" /><path d="m10.5 10.5 3 3" /></svg>
            <span class="ui-search-trigger-text">Examples, lessons, API…</span>
            <kbd class="ui-kbd">⌘K</kbd>
          </button>
          <button
            id="dd-theme-button"
            class="ui-button ui-button--icon"
            type="button"
            aria-label="Switch to dark theme"
            title="Switch to dark theme"
          ><svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" /><path d="M8 2.5v11A5.5 5.5 0 0 0 8 2.5z" fill="currentColor" stroke="none" /></svg></button>
        </div>
      </header>

      <main class="dd-workspace">
        <aside
          id="deep-dive-navigation"
          class="dd-navigation"
          aria-labelledby="dd-navigation-title"
          data-open="false"
        >
          <div class="dd-navigation-head">
            <h2 id="dd-navigation-title">Articles</h2>
            <button
              id="deep-dive-menu-close-button"
              class="ui-button ui-button--icon"
              type="button"
              aria-label="Close articles"
            ><svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 4.5 7 7M11.5 4.5l-7 7" /></svg></button>
          </div>
          <nav id="deep-dive-navigation-content" aria-label="Articles"></nav>
        </aside>

        <article class="dd-article" aria-labelledby="deep-dive-title">
          <div class="dd-article-bar">
            <button
              id="deep-dive-menu-button"
              class="ui-button ui-button--ghost dd-menu-button"
              type="button"
              aria-controls="deep-dive-navigation"
              aria-expanded="false"
            ><svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h10" /></svg><span>Articles</span></button>
            <span id="deep-dive-breadcrumb" class="dd-breadcrumb"></span>
          </div>
          <h1 id="deep-dive-title" tabindex="-1"></h1>
          <p id="deep-dive-summary" class="dd-lead"></p>
          <div id="deep-dive-sections" class="dd-sections"></div>
          <section id="deep-dive-related" class="dd-related" aria-labelledby="dd-related-title">
            <h2 id="dd-related-title">あわせて読む</h2>
            <ul id="deep-dive-related-list"></ul>
          </section>
        </article>
      </main>
    </div>

    <dialog id="search-dialog" class="pg-search-dialog" aria-label="Search">
      <div class="pg-search-field">
        <svg class="ui-icon pg-search-field-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" /><path d="m10.5 10.5 3 3" /></svg>
        <input
          id="search-input"
          type="text"
          role="combobox"
          aria-label="Search examples, lessons, API, and settings"
          aria-expanded="true"
          aria-controls="search-results"
          aria-autocomplete="list"
          autocomplete="off"
          spellcheck="false"
          placeholder="Examples, lessons, API…"
        />
        <kbd class="ui-kbd">esc</kbd>
      </div>
      <div id="search-scopes" class="pg-search-scopes" role="group" aria-label="Scope"></div>
      <div id="search-results" class="pg-search-results" role="listbox" aria-label="Results"></div>
      <div id="search-detail" class="pg-search-detail" hidden></div>
      <div class="pg-search-foot" aria-hidden="true">
        <span><kbd class="ui-kbd">↑</kbd> <kbd class="ui-kbd">↓</kbd> Navigate</span>
        <span><kbd class="ui-kbd">↵</kbd> Open</span>
        <span><kbd class="ui-kbd">esc</kbd> Close</span>
      </div>
    </dialog>
    <script type="module" src="/src/deep-dive/main.ts"></script>
  </body>
</html>
