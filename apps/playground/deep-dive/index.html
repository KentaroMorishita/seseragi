<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1110" />
    <meta
      name="description"
      content="Seseragiの設計思想・内部意味論・architecture trade-offを読む記事surface"
    />
    <title>Seseragi Articles</title>
  </head>
  <body class="deep-dive-body">
    <div class="deep-dive-shell">
      <header class="deep-dive-topbar">
        <div class="deep-dive-brand">
          <strong>Seseragi</strong>
          <span>Articles</span>
        </div>
        <nav aria-label="関連surface">
          <a href="../tour/">Tour</a>
          <a href="../">Playground</a>
        </nav>
      </header>
      <button
        id="deep-dive-menu-button"
        class="deep-dive-menu-button"
        type="button"
        aria-controls="deep-dive-navigation"
        aria-expanded="false"
      >記事カテゴリを開く</button>
      <main class="deep-dive-workspace">
        <aside
          id="deep-dive-navigation"
          class="deep-dive-navigation"
          aria-label="記事カテゴリ、topic、記事"
        >
          <div class="deep-dive-navigation-heading">
            <div>
              <span>EXPLORE BY TOPIC</span>
              <strong>Articles</strong>
            </div>
            <button
              id="deep-dive-menu-close-button"
              type="button"
              aria-label="記事一覧を閉じる"
            >閉じる</button>
          </div>
          <nav id="deep-dive-navigation-content"></nav>
        </aside>
        <article class="deep-dive-article" aria-labelledby="deep-dive-title">
          <span id="deep-dive-breadcrumb" class="deep-dive-kicker"></span>
          <h1 id="deep-dive-title" tabindex="-1"></h1>
          <p id="deep-dive-summary" class="deep-dive-lead"></p>
          <div id="deep-dive-sections" class="deep-dive-sections"></div>
          <section id="deep-dive-related" class="deep-dive-related">
            <h2>関連する実行教材とReference</h2>
            <ul id="deep-dive-related-list"></ul>
          </section>
        </article>
      </main>
    </div>
    <script type="module" src="/src/deep-dive/main.ts"></script>
  </body>
</html>
