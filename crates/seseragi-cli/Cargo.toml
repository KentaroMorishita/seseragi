[package]
name = "seseragi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "seseragi"
path = "src/main.rs"

[dependencies]
ctrlc = "3.4"
pulldown-cmark = { version = "=0.13.5", default-features = false, features = ["html"] }
seseragi-backend-rust = { path = "../seseragi-backend-rust" }
seseragi-dts = { path = "../seseragi-dts" }
seseragi-driver = { path = "../seseragi-driver" }
seseragi-project = { path = "../seseragi-project" }
seseragi-release = { path = "../seseragi-release" }
seseragi-runtime = { path = "../seseragi-runtime" }
seseragi-syntax = { path = "../seseragi-syntax" }
serde_json.workspace = true
sha2.workspace = true
tempfile = "3.27"

[dev-dependencies]
seseragi-lsp = { path = "../seseragi-lsp" }
url.workspace = true
