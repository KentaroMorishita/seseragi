[package]
name = "fixture/program-wasm-effect-factory-package"
version = "0.0.0"
language = ">=0.1.0 <0.2.0"

[run]
entry = "main"
target = "web"

[web.programs.calculation]
module = "calculation"
exports = ["create", "nested", "createDefect", "createChecked", "cleanupFactory", "pendingFactory"]

[foreign.typescript]
resolver = "node"
manifest = "host/package.json"
lockfile = "host/package-lock.json"
