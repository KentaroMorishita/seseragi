[package]
name = "fixture/program-wasm-text-line-filter-package"
version = "0.0.0"
language = ">=0.1.0 <0.2.0"

[run]
entry = "main"
target = "web"

[web.programs.processor]
module = "processor"
exports = ["clean", "factory"]

[foreign.typescript]
resolver = "node"
manifest = "host/package.json"
lockfile = "host/package-lock.json"
