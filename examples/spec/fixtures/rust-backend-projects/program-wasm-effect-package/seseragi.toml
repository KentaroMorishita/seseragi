[package]
name = "fixture/program-wasm-effect-package"
version = "0.0.0"
language = ">=0.1.0 <0.2.0"

[run]
entry = "main"
target = "web"

[web.programs.calculation]
module = "calculation"
exports = ["value", "rejection", "defect", "callback", "pending", "cleanup", "cancelCleanup", "late"]

[foreign.typescript]
resolver = "node"
manifest = "host/package.json"
lockfile = "host/package-lock.json"
