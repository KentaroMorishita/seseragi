[workspace]
members = [
  "crates/seseragi-cli",
  "crates/seseragi-conformance",
  "crates/seseragi-driver",
  "crates/seseragi-formatter",
  "crates/seseragi-lowering",
  "crates/seseragi-lsp",
  "crates/seseragi-provider",
  "crates/seseragi-project",
  "crates/seseragi-release",
  "crates/seseragi-runtime",
  "crates/seseragi-semantics",
  "crates/seseragi-source",
  "crates/seseragi-syntax",
  "crates/seseragi-wasm",
]
resolver = "2"

[workspace.package]
version = "0.20.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/morishita/seseragi"

[workspace.dependencies]
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "=0.8.23"
unicode-normalization = "0.1"
unicode-ident = "1.0"
url = "2.5"
wasm-bindgen = "0.2"
